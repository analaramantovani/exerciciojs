    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 4</title>
    <script>
        var numero = prompt("Digite um número");
        if (numero >= 1) {
            alert("O número é positivo.");
        } else if (numero < 0) {
            alert("O número é negativo.");
        } else {
            alert("Você digitou zero.");
        }
    </script>
