<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 6</title>
    <script>
        var compra = prompt("Digite o valor da compra");
        if (compra > 100) {
            desconto = compra * 0.1; 
            alert("Você ganhou um desconto de R$" + desconto + ". Valor final: R$" + (compra - desconto));
        } else {
            alert("Sem desconto. Valor total: R$" + compra);
        }
    </script>
</head>

</body>
</html>
