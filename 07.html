<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 7</title>
    <script>
        var dia = prompt("Digite o dia da semana (1-7)");
        if (dia == 1) {
            alert("Domingo");
        } else if (dia == 2) {
            alert("Segunda-feira");
        } else if (dia == 3) {
            alert("Terça-feira");
        } else if (dia == 4) {
            alert("Quarta-feira");
        } else if (dia == 5) {
            alert("Quinta-feira");
        } else if (dia == 6) {
            alert("Sexta-feira");
        } else if (dia == 7) {
            alert("Sábado");
        } else {
            alert("Dia inválido. Por favor, digite um número entre 1 e 7.");
        }
    </script>
</head>
<body>
    
</body>
</html>
